name: Build & Draft Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  read-version:
    name: Read & Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_ver.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract version from uploader/__version__.py
        id: get_ver
        shell: bash
        run: |
          VERSION=$(python3 -c "import ast, pathlib; tree = ast.parse(pathlib.Path('uploader/__version__.py').read_text(encoding='utf-8')); print(next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(getattr(t, 'id', None) == '__version__' for t in n.targets)))")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$VERSION' in uploader/__version__.py. Expected 'x.x.x' format without a leading 'v' (e.g. 1.0.0)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows Executable
    needs: read-version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        run: python -m pip install --upgrade pip pyinstaller PySide6 PyYAML

      - name: Generate Windows version resource
        shell: pwsh
        run: |
          $ver = "${{ needs.read-version.outputs.version }}"
          python -c "v = '$ver'; t = ', '.join(v.split('.') + ['0']); open('version_info.txt', 'w', encoding='utf-8').write(f'''VSVersionInfo(
            ffi=FixedFileInfo(filevers=({t}), prodvers=({t}), mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
            kids=[
              StringFileInfo([StringTable('040904B0', [
                StringStruct('FileDescription', 'DrainPype File Uploader'),
                StringStruct('FileVersion', '{v}.0'),
                StringStruct('InternalName', 'drainpype'),
                StringStruct('OriginalFilename', 'drainpype.exe'),
                StringStruct('ProductName', 'DrainPype File Uploader'),
                StringStruct('ProductVersion', '{v}.0'),
              ])]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])
            ]
          )\n''')"

      - name: Build single .exe
        shell: pwsh
        run: |
          $iconArgs = @()
          if (Test-Path "uploader\assets\icon.ico") {
            $iconArgs = @("--icon=uploader\assets\icon.ico")
          }
          pyinstaller --onefile --windowed --paths . `
            @iconArgs `
            --version-file="version_info.txt" `
            --add-data "uploader\assets;uploader\assets" `
            --collect-submodules uploader `
            --name "drainpype" `
            uploader/__main__.py

      - name: Package Windows zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive -Path "dist\drainpype.exe" -DestinationPath "release-assets\drainpype-windows.zip" -Force
          if (-not (Test-Path "release-assets\drainpype-windows.zip")) {
            throw "Windows release archive was not created."
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-release-zip
          path: release-assets/drainpype-windows.zip

  build-linux:
    name: Build Linux Portable Binary
    needs: read-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Qt/PySide6 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 fontconfig

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        run: python -m pip install --upgrade pip pyinstaller PySide6 PyYAML

      - name: Build single Linux binary
        run: |
          pyinstaller --onefile --paths . \
            --add-data "uploader/assets:uploader/assets" \
            --collect-submodules uploader \
            --name "drainpype" \
            uploader/__main__.py
          chmod +x dist/drainpype

      - name: Package Linux zip
        run: |
          mkdir -p release-assets
          zip -j "release-assets/drainpype-linux.zip" "dist/drainpype"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-release-zip
          path: release-assets/drainpype-linux.zip

  create-release:
    name: Create Draft GitHub Release
    needs: [read-version, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify release assets
        run: |
          test -f artifacts/drainpype-windows.zip
          test -f artifacts/drainpype-linux.zip

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          TAG="v${VERSION}"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "$TAG" \
            --generate-notes \
            "artifacts/drainpype-windows.zip" \
            "artifacts/drainpype-linux.zip"
